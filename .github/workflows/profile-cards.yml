name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Meetsheth25
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: true

      - name: Verify generated SVGs
        run: |
          missing=0
          for file in \
            assets/overview.dark.svg \
            assets/overview.light.svg \
            assets/contributions.dark.svg \
            assets/contributions.light.svg \
            assets/languages.dark.svg \
            assets/languages.light.svg
          do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty SVG file: $file"
              missing=$((missing + 1))
            else
              echo "Verified: $file"
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "Verification failed: $missing expected SVG file(s) are missing or empty."
            exit 1
          fi
